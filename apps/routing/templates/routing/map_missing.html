<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map not found</title>
<style>
  body { font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         color: #16202c; background: #eef2f6; display: grid; place-items: center;
         height: 100vh; margin: 0; }
  .card { background: #fff; padding: 32px 36px; border-radius: 10px; max-width: 480px;
          box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  h1 { font-size: 18px; margin: 0 0 10px; }
  p { color: #5b6b7c; margin: 0 0 8px; }
  code { background: #f2f5f8; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
</style>
</head>
<body>
  <div class="card">
    <h1>That map has expired</h1>
    <p>Maps are held for as long as the planned journey stays cached.</p>
    <p>Plan the journey again at <code>POST /api/v1/route/</code> and follow the
       <code>meta.map_url</code> in the response.</p>
  </div>
</body>
</html>
